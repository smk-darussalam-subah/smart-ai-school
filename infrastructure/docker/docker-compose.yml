# =============================================================================
# Docker Compose — Smart AI School (SMK Darussalam Subah)
# Domain: smkdarussalamsubah.sch.id
# Semua service berjalan dalam Docker network internal
# Hanya Nginx yang terhubung ke internet (port 80/443)
# =============================================================================

networks:
  smk-network:
    driver: bridge
    name: smk-network

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  n8n_data:
  ollama_data:
  metabase_data:
  uptime_data:
  prometheus_data:
  grafana_data:
  minio_data:
    name: ${MINIO_DATA_VOLUME_NAME:-docker_minio_data}
  backup_bin:
    # Physical volume can be approval-bound during recovery commissioning while
    # preserving the legacy tool volume for rollback. Default keeps current name.
    name: ${BACKUP_BIN_VOLUME_NAME:-docker_backup_bin}

services:

  # ─── DATABASE ─────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smk_db}
      POSTGRES_USER: ${POSTGRES_USER:-smk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./init-staging-db.sh:/docker-entrypoint-initdb.d/02-init-staging-db.sh:ro
    # ports tidak dimapping — aksesibel hanya via Docker network internal.
    # Dev lokal: gunakan docker-compose.dev.yml atau SSH tunnel ke VPS.
    networks:
      - smk-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smk_admin} -d ${POSTGRES_DB:-smk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '2', memory: '2G' }
        reservations: { cpus: '0.5', memory: '512M' }

  # ─── CACHE & QUEUE ────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: smk-redis
    restart: unless-stopped
    # Password di command line — visible di docker inspect.
    # Mitigasi: batasi akses Docker socket (hanya root dan appuser via sudo).
    # WAJIB list syntax: string form dijalankan via sh -c sehingga karakter
    # shell special (&, #, @) di password bisa memotong argumen.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
    # ports tidak dimapping — aksesibel hanya via Docker network internal.
    # Dev lokal: gunakan docker-compose.dev.yml atau SSH tunnel ke VPS.
    volumes:
      - redis_data:/data
    networks:
      - smk-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: '512M' }
        reservations: { cpus: '0.25', memory: '128M' }

  # ─── AUTHENTICATION ───────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: smk-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smk_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-smk_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # N-23b: Production mode (start). Sintaks diverifikasi via Keycloak 24.0 source.
      # KC_HOSTNAME wajib di start mode; v1 hostname provider (default di 24.0).
      KC_HOSTNAME: auth.smkdarussalamsubah.sch.id
      # strict=false: izinkan admin console via SSH tunnel (Host: localhost).
      KC_HOSTNAME_STRICT: "false"
      # N-29b: strict-https=true — paksa KC generate https:// untuk semua front-channel URL
      # (CSP frame-src, login-status-iframe, dll). Tanpa ini KC menambah http:// ke
      # frame-src → browser blokir iframe sebagai Mixed Content → admin console spinner.
      # KC_HTTP_ENABLED=true (di bawah) tetap mengizinkan KC listen HTTP di port 8080
      # untuk internal nginx; strict-https hanya mengontrol URL yang KC kirim ke browser.
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_LOG_LEVEL: INFO
      # N-23: Baca X-Forwarded-Proto: https dari nginx → issuer = https://.
      KC_PROXY_HEADERS: xforwarded
      # Single-node VPS: gunakan local cache (bukan Infinispan cluster).
      KC_CACHE: local
    # N-23b: start (production) — tanpa --import-realm.
    # realm-diis.json tetap di repo sebagai sumber, tapi TIDAK auto-import.
    # Auto-import berisiko revert URL prod ke localhost (N-26).
    # Realm diis sudah persist di smk_db.keycloak schema.
    command: start
    ports:
      # N-23b: loopback binding — 8080 tidak accessible dari internet.
      # Admin console: ssh -L 8080:localhost:8080 appuser@103.253.215.19
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
      # Phase 2: Custom DIIS login theme (CSS-only, parent=keycloak)
      - ../keycloak/themes/diis:/opt/keycloak/themes/diis:ro
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 24 ubi9-micro image tidak punya curl/wget/bash.
      # Gunakan /proc/net/tcp6 untuk verifikasi port 8080 (0x1F90) listening.
      # tcp6 dipakai karena Keycloak 24 default listen di IPv6 stack.
      test: ["CMD-SHELL", "cat /proc/net/tcp6 2>/dev/null | grep -q ':1F90 ' || cat /proc/net/tcp 2>/dev/null | grep -q ':1F90 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: '1', memory: '1G' }
        reservations: { cpus: '0.5', memory: '512M' }

  # ─── AUTOMATION ENGINE ────────────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:latest
    container_name: smk-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.smkdarussalamsubah.sch.id
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.smkdarussalamsubah.sch.id/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-smk_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-smk_admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      # Env vars untuk workflow notifikasi WA (diakses via $env.* di workflow JSON)
      FONNTE_API_KEY: ${FONNTE_API_KEY}
      ADMIN_PHONE_NUMBER: ${ADMIN_PHONE_NUMBER}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy

  # ─── AI LOKAL ─────────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: smk-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - smk-network
    deploy:
      resources:
        # R-28: Ollama sekarang embed-only (nomic-embed-text ~300 MB).
        # Chat/generate via OpenAI gpt-4.1-mini (cloud). Turunkan limit drastis.
        limits: { cpus: '1', memory: '1G' }
        reservations: { cpus: '0.5', memory: '512M' }
    # Uncomment jika VPS punya GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── AI LOKAL — INIT (R-31) ──────────────────────────────────────────────
  # One-shot container: pull nomic-embed-text otomatis setelah Ollama ready.
  # R-31: HANYA pull nomic-embed-text (embed model). qwen2.5:7b TIDAK dipakai lagi.

  ollama-init:
    image: ollama/ollama:latest
    container_name: smk-ollama-init
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 10
        echo "Pulling nomic-embed-text (embed model, ~300 MB)..."
        ollama pull nomic-embed-text
        echo "Model pull complete. Ollama ready for embedding."
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  # ─── ANALYTICS DASHBOARD ──────────────────────────────────────────────────

  metabase:
    image: metabase/metabase:v0.49.10
    container_name: smk-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${POSTGRES_DB:-smk_db}
      MB_DB_USER: ${POSTGRES_USER:-smk_admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_SCHEMA: metabase
      MB_SITE_URL: https://analytics.smkdarussalamsubah.sch.id
      JAVA_TIMEZONE: Asia/Jakarta
    volumes:
      - metabase_data:/metabase-data
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy

  # ─── FILE STORAGE ─────────────────────────────────────────────────────────

  minio:
    image: minio/minio:latest
    container_name: smk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smkadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: smk-darussalam-subah
    volumes:
      - minio_data:/data
    networks:
      - smk-network

  # ─── MONITORING ───────────────────────────────────────────────────────────

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: smk-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    networks:
      - smk-network

  prometheus:
    image: prom/prometheus:latest
    container_name: smk-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - smk-network

  grafana:
    image: grafana/grafana:latest
    container_name: smk-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitor.smkdarussalamsubah.sch.id
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - smk-network
    depends_on:
      - prometheus

  # ─── MONITORING EXPORTERS ────────────────────────────────────────────────
  # Metrics exporter untuk Prometheus — diakses internal (tidak ada ports mapping).
  # Dashboard Grafana postgresql.json + redis.json butuh kedua service ini.

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: smk-postgres-exporter
    restart: unless-stopped
    environment:
      # DATABASE_URL sudah URL-encoded (di-patch oleh deploy.yml). Exporter menerima format postgresql://.
      DATA_SOURCE_NAME: ${DATABASE_URL}
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: smk-redis-exporter
    restart: unless-stopped
    environment:
      # REDIS_URL format redis://:pass@host:port — didukung langsung oleh redis-exporter.
      REDIS_ADDR: ${REDIS_URL}
    networks:
      - smk-network
    depends_on:
      - redis

  # ─── BACKEND API (NestJS) ─────────────────────────────────────────────────

  # One-shot container: jalankan Prisma migration sebelum API start.
  # Dipanggil oleh deploy.yml sebagai langkah terpisah.
  # Ini memisahkan hak DDL (CREATE/ALTER) dari runtime API.
  api-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: smk-api-migrate
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      GUARD_STAGING_DB: ${GUARD_STAGING_DB:-0}
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy
    # Entrypoint: jalankan migration dengan guardrail N-20.
    entrypoint: ["sh", "-c", "if [ \"$${GUARD_STAGING_DB:-0}\" = \"1\" ]; then _DB=$$(echo $${DATABASE_URL} | sed 's|.*/||' | sed 's|?.*||'); if [ \"$$_DB\" != \"smk_staging_db\" ]; then echo '❌ GUARDRAIL N-20: DATABASE_URL bukan smk_staging_db!' >&2; exit 1; fi; echo '✅ Guardrail N-20 OK'; fi; cd /app/packages/database && /app/node_modules/.bin/prisma migrate deploy"]
    profiles:
      - migrate

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: smk-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # DATABASE_URL harus di-set di .env dengan password yang sudah URL-encoded.
      # Jangan konstruksi dari ${POSTGRES_PASSWORD} langsung karena jika password
      # mengandung karakter khusus (@, #, !, dll), URL akan corrupt dan Prisma
      # akan parse hostname yang salah (P1001).
      # deploy.yml generate nilai ini otomatis dengan python3 urllib.parse.quote().
      DATABASE_URL: ${DATABASE_URL}
      # REDIS_URL harus di-set di .env dengan password yang sudah URL-encoded.
      # Sama seperti DATABASE_URL — deploy.yml generate nilai ini otomatis.
      REDIS_URL: ${REDIS_URL}
      REDIS_QUEUE_NAMESPACE: ${REDIS_QUEUE_NAMESPACE}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: diis
      KEYCLOAK_ISSUER: https://auth.smkdarussalamsubah.sch.id/realms/diis
      KEYCLOAK_CLIENT_ID: diis-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET}
      WEB_URL: https://smkdarussalamsubah.sch.id
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_DIMENSIONS: ${OLLAMA_EMBED_DIMENSIONS:-768}
      # R-28: Hybrid AI — OpenAI (chat/generate) + Ollama (embed only)
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@smkdarussalamsubah.sch.id}
      APPOINTMENT_AUTOMATION_TOKEN: ${APPOINTMENT_AUTOMATION_TOKEN}
      CLASS_ACTIVITY_MEDIA_ENDPOINT: ${CLASS_ACTIVITY_MEDIA_ENDPOINT:-http://minio:9000}
      CLASS_ACTIVITY_MEDIA_ACCESS_KEY: ${CLASS_ACTIVITY_MEDIA_ACCESS_KEY}
      CLASS_ACTIVITY_MEDIA_SECRET_KEY: ${CLASS_ACTIVITY_MEDIA_SECRET_KEY}
      CLASS_ACTIVITY_MEDIA_BUCKET: ${CLASS_ACTIVITY_MEDIA_BUCKET:-diis-class-activities}
      CLASS_ACTIVITY_MEDIA_REGION: ${CLASS_ACTIVITY_MEDIA_REGION:-us-east-1}
      API_PORT: "3001"
      TZ: Asia/Jakarta
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '1', memory: '1G' }
        reservations: { cpus: '0.25', memory: '256M' }

  # ─── FRONTEND WEB (Next.js) ───────────────────────────────────────────────

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: smk-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: https://api.smkdarussalamsubah.sch.id
      NEXT_PUBLIC_KEYCLOAK_URL: https://auth.smkdarussalamsubah.sch.id
      NEXT_PUBLIC_KEYCLOAK_REALM: diis
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: diis-web
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      # Next-Auth server-side (N22) — JANGAN NEXT_PUBLIC_ untuk secret
      NEXTAUTH_URL: https://smkdarussalamsubah.sch.id
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_ISSUER: https://auth.smkdarussalamsubah.sch.id/realms/diis
      KEYCLOAK_CLIENT_ID: diis-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      API_URL: https://api.smkdarussalamsubah.sch.id
      # N-26: Next.js standalone default bind 127.0.0.1 → tidak terjangkau dari nginx.
      # HOSTNAME=0.0.0.0 memaksa listen di semua interface Docker network.
      HOSTNAME: "0.0.0.0"
      # Metabase embed (SMA-47) — server-side only, JANGAN NEXT_PUBLIC_
      METABASE_SITE_URL: ${METABASE_SITE_URL}
      METABASE_SECRET_KEY: ${METABASE_SECRET_KEY}
      METABASE_DASHBOARD_ID: ${METABASE_DASHBOARD_ID}
    networks:
      - smk-network
    depends_on:
      - api
    deploy:
      resources:
        limits: { cpus: '1', memory: '512M' }
        reservations: { cpus: '0.25', memory: '128M' }

  # ─── BACKUP OTOMATIS ──────────────────────────────────────────────────────

  pg-backup:
    image: postgres:16.4-alpine3.20@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: smk-pg-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-diis_admin}
      POSTGRES_DB: ${POSTGRES_DB:-diis_db}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-diis_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: diis-backup
      BACKUP_DAILY_POINTS: "3"
      BACKUP_MAX_DEGRADED_POINTS: "3"
      BACKUP_LOCAL_BUDGET_BYTES: ${BACKUP_LOCAL_BUDGET_BYTES:-4015794422}
      BACKUP_MIN_FREE_PERCENT: "25"
      BACKUP_SPACE_MULTIPLIER: "3"
      MINIO_TARGET_PATH: /var/lib/diis-minio-target
      APP_OBJECT_BUCKET: ${CLASS_ACTIVITY_MEDIA_BUCKET:-diis-class-activities}
      OFFSITE_CRYPT_REMOTE: ${BACKUP_OFFSITE_CRYPT_REMOTE:-}
      OFFSITE_CONFIG_FINGERPRINT: ${BACKUP_OFFSITE_CONFIG_FINGERPRINT:-}
      OFFSITE_EXPECTED_PROVIDER: ${BACKUP_OFFSITE_EXPECTED_PROVIDER:-}
      OFFSITE_EXPECTED_ORIGIN: ${BACKUP_OFFSITE_EXPECTED_ORIGIN:-}
      OFFSITE_EXPECTED_TEAM_DRIVE_SHA256: ${BACKUP_OFFSITE_EXPECTED_TEAM_DRIVE_SHA256:-}
      OFFSITE_EXPECTED_ROOT_FOLDER_SHA256: ${BACKUP_OFFSITE_EXPECTED_ROOT_FOLDER_SHA256:-}
      OFFSITE_RETENTION_APPLY: ${BACKUP_OFFSITE_RETENTION_APPLY:-0}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-1}
      BACKUP_BUCKET_CREATION_ALLOWED: ${BACKUP_BUCKET_CREATION_ALLOWED:-1}
      BACKUP_LOCK_DIR: /var/lock/diis-backup/backup.lock
      RCLONE_CONFIG: /run/diis-secrets/rclone.conf
      RCLONE_MINIO_REMOTE: "diisminio:"
      RCLONE_CONFIG_DIISMINIO_TYPE: s3
      RCLONE_CONFIG_DIISMINIO_PROVIDER: Minio
      RCLONE_CONFIG_DIISMINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-diis_minio}
      RCLONE_CONFIG_DIISMINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      RCLONE_CONFIG_DIISMINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_DIISMINIO_REGION: us-east-1
      TZ: Asia/Jakarta
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-lib.sh:/backup-lib.sh:ro
      - ./scripts/offsite-replication.sh:/offsite-replication.sh:ro
      - ./scripts/restore-objects.sh:/restore-objects.sh:ro
      - ./scripts/release-prechange-backup.sh:/release-prechange-backup.sh:ro
      - backup_bin:/opt/backup-bin
      - minio_data:/var/lib/diis-minio-target:ro
      - ${RCLONE_CONFIG_HOST_PATH:-/etc/diis/rclone.conf}:/run/diis-secrets/rclone.conf:ro
      - ${BACKUP_LOCK_HOST_PATH:-/var/lock/diis-backup}:/var/lock/diis-backup
    # TZ container adalah Asia/Jakarta; cron 02:00 berarti 02:00 WIB.
    command:
      - sh
      - -c
      - |
        MC_VERSION='RELEASE.2025-08-13T08-35-41Z'
        MC_SHA256='01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891'
        MC_URL="https://dl.min.io/client/mc/release/linux-amd64/archive/mc.$${MC_VERSION}"
        RCLONE_VERSION='v1.70.3'
        RCLONE_SHA256='7d69057e69385f6514a9684c7eaa424d972096b130284bb34dd967c4ed4f9dad'
        RCLONE_URL="https://downloads.rclone.org/$${RCLONE_VERSION}/rclone-$${RCLONE_VERSION}-linux-amd64.zip"
        mkdir -p /opt/backup-bin
        chmod 700 /opt/backup-bin
        if ! echo "$${MC_SHA256}  /opt/backup-bin/mc" | sha256sum -c - >/dev/null 2>&1; then
          wget -q -O /opt/backup-bin/mc.candidate "$${MC_URL}"
          echo "$${MC_SHA256}  /opt/backup-bin/mc.candidate" | sha256sum -c -
          mv /opt/backup-bin/mc.candidate /opt/backup-bin/mc
          chmod 700 /opt/backup-bin/mc
        fi
        if ! echo "$${RCLONE_SHA256}  /opt/backup-bin/rclone.zip" | sha256sum -c - >/dev/null 2>&1; then
          wget -q -O /opt/backup-bin/rclone.zip.candidate "$${RCLONE_URL}"
          echo "$${RCLONE_SHA256}  /opt/backup-bin/rclone.zip.candidate" | sha256sum -c -
          mv /opt/backup-bin/rclone.zip.candidate /opt/backup-bin/rclone.zip
        fi
        unzip -p /opt/backup-bin/rclone.zip "rclone-$${RCLONE_VERSION}-linux-amd64/rclone" > /opt/backup-bin/rclone.candidate
        chmod 700 /opt/backup-bin/rclone.candidate
        /opt/backup-bin/rclone.candidate version | grep -F "rclone $${RCLONE_VERSION}"
        mv /opt/backup-bin/rclone.candidate /opt/backup-bin/rclone
        /opt/backup-bin/mc alias set myminio "$$MINIO_ENDPOINT" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" --quiet
        case "$${BACKUP_BUCKET_CREATION_ALLOWED}" in
          1)
            /opt/backup-bin/mc mb --ignore-existing myminio/"$$BACKUP_BUCKET"
            /opt/backup-bin/mc mb --ignore-existing myminio/"$$APP_OBJECT_BUCKET"
            ;;
          0)
            /opt/backup-bin/mc stat myminio/"$$BACKUP_BUCKET" >/dev/null
            /opt/backup-bin/mc stat myminio/"$$APP_OBJECT_BUCKET" >/dev/null
            ;;
          *)
            echo '[pg-backup] BACKUP_BUCKET_CREATION_ALLOWED wajib 0 atau 1.' >&2
            exit 64
            ;;
        esac
        case "$${BACKUP_SCHEDULE_ENABLED}" in
          1)
            echo "0 2 * * * PATH=/opt/backup-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin sh /backup.sh >> /var/log/backup.log 2>&1" | crontab -
            chmod 600 /etc/crontabs/root
            echo '[pg-backup] Backup dijadwalkan setiap 02:00 WIB. Container siap.'
            ;;
          0)
            crontab -r 2>/dev/null || true
            echo '[pg-backup] Scheduler disabled untuk commissioning.'
            ;;
          *)
            echo '[pg-backup] BACKUP_SCHEDULE_ENABLED wajib 0 atau 1.' >&2
            exit 64
            ;;
        esac
        crond -f -l 2
    networks:
      - smk-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # ─── REVERSE PROXY ────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: smk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
      - keycloak
      - n8n
      - metabase
      - grafana
      - uptime-kuma
    networks:
      - smk-network
    deploy:
      resources:
        limits: { cpus: '0.5', memory: '256M' }
        reservations: { cpus: '0.25', memory: '64M' }
