<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064534" />
    <title>DIIS sedang offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; }
      main { width: min(100%, 560px); text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 8px; background: #064534; color: #fff; font-size: 30px; font-weight: 800; }
      h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.15; }
      p { margin: 16px auto 0; max-width: 44ch; color: #475569; font-size: 1rem; line-height: 1.65; }
      a { min-height: 44px; margin-top: 28px; padding: 11px 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #1d4ed8; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0f172a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">D</div>
      <h1>DIIS belum terhubung</h1>
      <p>Perangkat sedang offline. Sambungkan kembali ke internet untuk membuka data terbaru. Halaman ini tidak menyimpan data akun atau data sekolah.</p>
      <a href="/dashboard">Coba lagi</a>
    </main>
  </body>
</html>
