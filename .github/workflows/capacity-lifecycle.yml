name: Capacity Lifecycle Contract

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  capacity-contract:
    name: Capacity Lifecycle Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline and synthetic contracts only
        run: |
          python3 -B infrastructure/deploy/tests/capacity-lifecycle-contract.py
          python3 -B infrastructure/deploy/verify-capacity-handoff.py
          bash -n infrastructure/deploy/diis-build-cache-cleanup.sh
