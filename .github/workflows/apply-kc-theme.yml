name: Apply DIIS Keycloak Theme

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved main commit SHA
        required: true
        type: string
      previous_production_sha:
        description: Previous production commit SHA for Gitflow rollback
        required: true
        type: string
      confirmation:
        description: Type APPLY_DIIS_SHARED_AUTH_THEME
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-shared-keycloak-theme
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate exact source and dispatch contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Fail closed on ref, SHA, confirmation, or source mismatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ inputs.previous_production_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          set +x

          [[ "$DISPATCH_REF" == main ]] || { echo "FATAL: workflow must be dispatched from main"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: expected_sha must be a full lowercase SHA"; exit 1; }
          [[ "$PREVIOUS_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: previous_production_sha must be a full lowercase SHA"; exit 1; }
          [[ "$CONFIRMATION" == APPLY_DIIS_SHARED_AUTH_THEME ]] || { echo "FATAL: confirmation mismatch"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "FATAL: checked-out main does not match expected_sha"; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]] || { echo "FATAL: runner checkout is dirty"; exit 1; }
          git cat-file -e "$PREVIOUS_PRODUCTION_SHA^{commit}"
          git merge-base --is-ancestor "$PREVIOUS_PRODUCTION_SHA" "$EXPECTED_SHA"
          [[ "$(git rev-parse "$EXPECTED_SHA^1")" == "$PREVIOUS_PRODUCTION_SHA" ]] || {
            echo "FATAL: previous_production_sha must be the first parent of expected_sha"
            exit 1
          }

          bash infrastructure/keycloak/scripts/verify-theme-bundle.sh \
            infrastructure/keycloak/themes/diis/login \
            infrastructure/keycloak/diis-login-theme.sha256

  apply-theme:
    name: Apply exact theme to shared production Keycloak
    needs: validate-dispatch
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run controlled cutover through the production checkout
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREVIOUS_PRODUCTION_SHA: ${{ inputs.previous_production_sha }}
          CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: appuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: EXPECTED_SHA,PREVIOUS_PRODUCTION_SHA,CUTOVER_CONFIRMATION,RUN_ID
          script: |
            set -euo pipefail
            set +x
            export DIIS_EXPECTED_SHA="$EXPECTED_SHA"
            export DIIS_PREVIOUS_PRODUCTION_SHA="$PREVIOUS_PRODUCTION_SHA"
            export DIIS_CONFIRMATION="$CUTOVER_CONFIRMATION"
            export DIIS_RUN_ID="$RUN_ID"
            exec bash /home/appuser/smart-ai-school/infrastructure/keycloak/scripts/apply-theme-cutover-remote.sh

      - name: Report controlled success
        if: success()
        run: echo "DIIS shared Keycloak theme cutover and verification succeeded"

      - name: Report failure or containment
        if: failure()
        run: echo "DIIS shared Keycloak theme cutover failed; inspect redacted containment output"
