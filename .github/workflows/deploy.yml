name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: diis-shared-host-deployment
  cancel-in-progress: false

jobs:
  validate-deployment-context:
    name: Validate deployment context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reject non-deployment refs
        env:
          DIIS_GITHUB_REF: ${{ github.ref }}
          DIIS_DEPLOY_BRANCH: ${{ github.ref_name }}
          DIIS_EXPECTED_SHA: ${{ github.sha }}
          DIIS_RUN_ID: ${{ github.run_id }}
          DIIS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash infrastructure/deploy/validate-deploy-context.sh \
            "$DIIS_GITHUB_REF" "$DIIS_DEPLOY_BRANCH" "$DIIS_EXPECTED_SHA" \
            "$DIIS_RUN_ID" "$DIIS_RUN_ATTEMPT"

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    needs: validate-deployment-context
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://smkdarussalamsubah.sch.id' || 'https://staging.smkdarussalamsubah.sch.id' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DIIS_GITHUB_REF: ${{ github.ref }}
          DIIS_DEPLOY_BRANCH: ${{ github.ref_name }}
          DIIS_EXPECTED_SHA: ${{ github.sha }}
          DIIS_RUN_ID: ${{ github.run_id }}
          DIIS_RUN_ATTEMPT: ${{ github.run_attempt }}
          DIIS_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          DIIS_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DIIS_VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:admin@smkdarussalamsubah.sch.id' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: appuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Staging uses a no-cache monorepo build; keep the SSH command alive
          # long enough to finish the build, migration, health-check, and post-check.
          command_timeout: 20m
          envs: DIIS_GITHUB_REF,DIIS_DEPLOY_BRANCH,DIIS_EXPECTED_SHA,DIIS_RUN_ID,DIIS_RUN_ATTEMPT,DIIS_VAPID_PUBLIC_KEY,DIIS_VAPID_PRIVATE_KEY,DIIS_VAPID_SUBJECT
          script: |
            set -euo pipefail

            case "${DIIS_GITHUB_REF:?}:${DIIS_DEPLOY_BRANCH:?}" in
              refs/heads/main:main|refs/heads/staging:staging) ;;
              *) echo "DEPLOY_CONTEXT_REJECTED reason=forbidden-ref"; exit 64 ;;
            esac
            [[ "${DIIS_EXPECTED_SHA:?}" =~ ^[0-9a-f]{40}$ ]] || exit 64
            [[ "${DIIS_RUN_ID:?}" =~ ^[1-9][0-9]*$ ]] || exit 64
            [[ "${DIIS_RUN_ATTEMPT:?}" =~ ^[1-9][0-9]*$ ]] || exit 64
            BRANCH="$DIIS_DEPLOY_BRANCH"
            EXPECTED_SHA="$DIIS_EXPECTED_SHA"
            RUN_ID="$DIIS_RUN_ID"
            RUN_ATTEMPT="$DIIS_RUN_ATTEMPT"
            export DIIS_DEPLOY_RUN_ID="$RUN_ID"
            export DIIS_DEPLOY_RUN_ATTEMPT="$RUN_ATTEMPT"
            echo "🚀 Deploying branch: ${BRANCH}"

            # Serialize every official deployment before checkout or runtime access.
            DEPLOY_LOCK_DIR=/home/appuser/.local/state/diis-deploy
            DEPLOY_LOCK_FILE="$DEPLOY_LOCK_DIR/deploy.lock"
            DEPLOY_LOCK_METADATA="$DEPLOY_LOCK_DIR/owner"
            DEPLOY_LOCK_TIMEOUT_SECONDS=300
            umask 077
            mkdir -p "$DEPLOY_LOCK_DIR"
            chmod 700 "$DEPLOY_LOCK_DIR"
            command -v flock >/dev/null
            exec 9>"$DEPLOY_LOCK_FILE"
            if ! flock --wait "$DEPLOY_LOCK_TIMEOUT_SECONDS" 9; then
              echo "DEPLOY_HOST_LOCK_TIMEOUT run_id=${RUN_ID} branch=${BRANCH} metadata=${DEPLOY_LOCK_METADATA}"
              exit 73
            fi
            printf 'state=active run_id=%s attempt=%s branch=%s sha=%s acquired_at=%s\n' \
              "$RUN_ID" "$RUN_ATTEMPT" "$BRANCH" "$EXPECTED_SHA" "$(date --iso-8601=seconds)" \
              >"${DEPLOY_LOCK_METADATA}.tmp"
            mv -f "${DEPLOY_LOCK_METADATA}.tmp" "$DEPLOY_LOCK_METADATA"
            echo "DEPLOY_HOST_LOCK_ACQUIRED run_id=${RUN_ID} branch=${BRANCH}"

            NGINX_ROLLBACK_CONFIG=""
            NGINX_AUTHORITY_CONFIG=""
            INGRESS_ROLLOUT_HANDOFF=0

            preserve_unconsumed_rollback() {
              local recovery_dir recovery_path digest_line digest
              recovery_dir="$DEPLOY_LOCK_DIR/ingress-recovery"
              mkdir -p "$recovery_dir"
              chmod 700 "$recovery_dir"
              recovery_path="$recovery_dir/rollback-${RUN_ID}-${RUN_ATTEMPT}-${EXPECTED_SHA}.conf"
              mv -f "$NGINX_ROLLBACK_CONFIG" "$recovery_path"
              chmod 600 "$recovery_path"
              digest_line=$(sha256sum "$recovery_path")
              digest=${digest_line%% *}
              echo "SHARED_INGRESS_RECOVERY_ARTIFACT kind=rollback path=${recovery_path} digest=${digest}"
            }

            cleanup_deploy_temp() {
              if [ -n "$NGINX_AUTHORITY_CONFIG" ] && [ -f "$NGINX_AUTHORITY_CONFIG" ]; then
                rm -f "$NGINX_AUTHORITY_CONFIG"
              fi
              if [ -n "$NGINX_ROLLBACK_CONFIG" ] && [ -f "$NGINX_ROLLBACK_CONFIG" ]; then
                if [ "$INGRESS_ROLLOUT_HANDOFF" -eq 1 ]; then
                  preserve_unconsumed_rollback || \
                    echo "SHARED_INGRESS_RECOVERY_PRESERVATION_FAILED source=${NGINX_ROLLBACK_CONFIG}"
                else
                  rm -f "$NGINX_ROLLBACK_CONFIG"
                fi
              fi
              printf 'state=released run_id=%s attempt=%s branch=%s sha=%s released_at=%s\n' \
                "$RUN_ID" "$RUN_ATTEMPT" "$BRANCH" "$EXPECTED_SHA" "$(date --iso-8601=seconds)" \
                >"${DEPLOY_LOCK_METADATA}.tmp" 2>/dev/null || true
              mv -f "${DEPLOY_LOCK_METADATA}.tmp" "$DEPLOY_LOCK_METADATA" 2>/dev/null || true
            }
            trap cleanup_deploy_temp EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM

            # ── Tentukan working-dir dan env-file berdasarkan branch ──────────
            if [ "$BRANCH" = "main" ]; then
              WORK_DIR=/home/appuser/smart-ai-school
              ENV_FILE=.env
              COMPOSE_ARGS="-f docker-compose.yml"
              COMPOSE_PROJECT=""
              API_CONTAINER=smk-api
              WEB_CONTAINER=smk-web
            else
              # Staging: direktori terpisah, DB terpisah, compose project terpisah
              WORK_DIR=/opt/diis-staging/smart-ai-school
              ENV_FILE=.env.staging
              COMPOSE_ARGS="-p smk-staging -f docker-compose.yml -f docker-compose.staging.yml"
              COMPOSE_PROJECT="-p smk-staging"
              API_CONTAINER=smk-staging-api
              WEB_CONTAINER=smk-staging-web
            fi

            # ── Checkout exact workflow SHA di working-dir yang benar ─────────
            # PENTING: staging menggunakan direktori /opt/diis-staging/ terpisah
            # sehingga git checkout staging TIDAK menyentuh working-tree produksi.
            cd "$WORK_DIR"
            CURRENT_BRANCH=$(git branch --show-current)
            if [ "$CURRENT_BRANCH" != "$BRANCH" ]; then
              echo "DEPLOY_WRONG_BRANCH expected=${BRANCH} actual=${CURRENT_BRANCH:-detached}"
              exit 1
            fi
            if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
              echo "DEPLOY_HOST_DRIFT_DETECTED branch=${BRANCH}"
              git status --short
              exit 1
            fi

            if [ "$BRANCH" = "main" ]; then
              NGINX_ROLLBACK_CONFIG=$(mktemp /tmp/diis-nginx-predeploy.XXXXXX)
              cp -p infrastructure/nginx/nginx.conf "$NGINX_ROLLBACK_CONFIG"
            fi

            git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_SHA=$(git rev-parse "origin/$BRANCH")
            [[ "$REMOTE_SHA" == "$EXPECTED_SHA" ]] || {
              echo "DEPLOY_SHA_RACE expected=${EXPECTED_SHA} remote=${REMOTE_SHA}"
              exit 1
            }
            git merge --ff-only "$EXPECTED_SHA"
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
              echo "DEPLOY_SHA_MISMATCH expected=${EXPECTED_SHA} actual=$(git rev-parse HEAD)"
              exit 1
            }
            if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
              echo "DEPLOY_POST_CHECKOUT_DRIFT branch=${BRANCH}"
              git status --short
              exit 1
            fi
            echo "DEPLOY_SOURCE_VERIFIED sha=${EXPECTED_SHA} tree=$(git rev-parse 'HEAD^{tree}')"

            INGRESS_SCRIPT="$WORK_DIR/infrastructure/deploy/diis-shared-ingress.sh"
            test -f "$INGRESS_SCRIPT"
            NGINX_CONFIG_LINE=$(sha256sum "$WORK_DIR/infrastructure/nginx/nginx.conf")
            NGINX_CONFIG_SHA=${NGINX_CONFIG_LINE%% *}
            if [ "$BRANCH" = "main" ]; then
              bash "$INGRESS_SCRIPT" preflight-production "$NGINX_CONFIG_SHA" "$NGINX_ROLLBACK_CONFIG"
            else
              git fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
              AUTHORITATIVE_MAIN_SHA=$(git rev-parse origin/main)
              AUTHORITATIVE_MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
              NGINX_AUTHORITY_CONFIG=$(mktemp /tmp/diis-nginx-main-authority.XXXXXX)
              git show "${AUTHORITATIVE_MAIN_SHA}:infrastructure/nginx/nginx.conf" \
                >"$NGINX_AUTHORITY_CONFIG"
              AUTHORITY_CONFIG_LINE=$(sha256sum "$NGINX_AUTHORITY_CONFIG")
              AUTHORITY_CONFIG_SHA=${AUTHORITY_CONFIG_LINE%% *}
              bash "$INGRESS_SCRIPT" preflight-staging \
                "$AUTHORITATIVE_MAIN_SHA" "$AUTHORITATIVE_MAIN_TREE" \
                "$AUTHORITY_CONFIG_SHA" "$NGINX_AUTHORITY_CONFIG"
            fi

            # Masuk ke direktori docker (relatif terhadap WORK_DIR)
            cd "$WORK_DIR/infrastructure/docker"

            # ── Patch env-file: tulis DATABASE_URL dengan password URL-encoded ──
            _PW=$(grep '^POSTGRES_PASSWORD=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            _USER=$(grep '^POSTGRES_USER=' "$ENV_FILE" | head -1 | cut -d= -f2- || echo 'smk_admin')
            _DB=$(grep '^POSTGRES_DB=' "$ENV_FILE" | head -1 | cut -d= -f2- || echo 'smk_db')
            _ENC=$(printf '%s' "$_PW" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=''),end='')")
            _URL="postgresql://${_USER}:${_ENC}@postgres:5432/${_DB}"
            if grep -q '^DATABASE_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${_URL}|" "$ENV_FILE"
            else
              printf '\nDATABASE_URL=%s\n' "${_URL}" >> "$ENV_FILE"
            fi
            echo "✅ DATABASE_URL → postgresql://${_USER}:***@postgres:5432/${_DB}"

            # ── Patch env-file: tulis REDIS_URL dengan password URL-encoded ────
            _RPW=$(grep '^REDIS_PASSWORD=' "$ENV_FILE" | head -1 | cut -d= -f2- || echo '')
            if [ -n "$_RPW" ]; then
              _RENC=$(printf '%s' "$_RPW" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=''),end='')")
              _RURL="redis://:${_RENC}@redis:6379"
            else
              _RURL="redis://redis:6379"
            fi
            if grep -q '^REDIS_URL=' "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^REDIS_URL=.*|REDIS_URL=${_RURL}|" "$ENV_FILE"
            else
              printf '\nREDIS_URL=%s\n' "${_RURL}" >> "$ENV_FILE"
            fi
            echo "✅ REDIS_URL → redis://:***@redis:6379"

            set_env_var() {
              _KEY="$1"
              _VALUE="$2"
              if grep -q "^${_KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${_KEY}=.*|${_KEY}=${_VALUE}|" "$ENV_FILE"
              else
                printf '\n%s=%s\n' "$_KEY" "$_VALUE" >> "$ENV_FILE"
              fi
            }

            if [ -n "${DIIS_VAPID_PUBLIC_KEY:-}" ] && [ -n "${DIIS_VAPID_PRIVATE_KEY:-}" ]; then
              set_env_var VAPID_PUBLIC_KEY "$DIIS_VAPID_PUBLIC_KEY"
              set_env_var VAPID_PRIVATE_KEY "$DIIS_VAPID_PRIVATE_KEY"
              set_env_var VAPID_SUBJECT "${DIIS_VAPID_SUBJECT:-mailto:admin@smkdarussalamsubah.sch.id}"
              set_env_var NEXT_PUBLIC_VAPID_PUBLIC_KEY "$DIIS_VAPID_PUBLIC_KEY"
              echo "✅ VAPID environment present for ${BRANCH} (values redacted)"
            else
              echo "⚠️ VAPID secrets unavailable for ${BRANCH}; PWA Push remains disabled"
            fi

            if [ "$BRANCH" = "staging" ]; then
              # ── Patch .env.staging: tulis STAGING_DATABASE_URL ──────────────
              # STAGING_DATABASE_URL selalu menunjuk smk_staging_db (bukan smk_db).
              _STAGING_URL="postgresql://${_USER}:${_ENC}@postgres:5432/smk_staging_db"
              if grep -q '^STAGING_DATABASE_URL=' "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^STAGING_DATABASE_URL=.*|STAGING_DATABASE_URL=${_STAGING_URL}|" "$ENV_FILE"
              else
                printf '\nSTAGING_DATABASE_URL=%s\n' "${_STAGING_URL}" >> "$ENV_FILE"
              fi
              echo "✅ STAGING_DATABASE_URL → postgresql://${_USER}:***@postgres:5432/smk_staging_db"

              # Shared ingress dan smk-staging-net adalah infrastructure-owned.
              # Preflight di atas sudah fail-closed bila topology tidak siap.

              # ── Init staging DB (idempoten) ─────────────────────────────────
              echo "🔧 Memastikan smk_staging_db siap..."
              docker compose $COMPOSE_ARGS --env-file "$ENV_FILE" \
                run --rm db-init-staging

              echo "✅ smk_staging_db siap"
            fi

            # Provision private class-activity storage before building the API.
            # Each environment gets a separate bucket and least-privilege user;
            # MinIO root credentials never enter the API container or action log.
            if [ "$BRANCH" = "main" ]; then
              _MEDIA_ACCESS="diis-production-media"
              _MEDIA_BUCKET="diis-class-activities"
              _MEDIA_POLICY="diis-production-class-activity"
            else
              _MEDIA_ACCESS="diis-staging-media"
              _MEDIA_BUCKET="diis-class-activities-staging"
              _MEDIA_POLICY="diis-staging-class-activity"
            fi
            _MEDIA_SECRET=$(grep '^CLASS_ACTIVITY_MEDIA_SECRET_KEY=' "$ENV_FILE" | head -1 | cut -d= -f2- || true)
            _MEDIA_RESET="0"
            if [ -z "$_MEDIA_SECRET" ]; then
              _MEDIA_SECRET=$(openssl rand -hex 32)
              _MEDIA_RESET="1"
            fi
            upsert_media_env() {
              _KEY="$1"
              _VALUE="$2"
              if grep -q "^${_KEY}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${_KEY}=.*|${_KEY}=${_VALUE}|" "$ENV_FILE"
              else
                printf '\n%s=%s\n' "$_KEY" "$_VALUE" >> "$ENV_FILE"
              fi
            }
            upsert_media_env CLASS_ACTIVITY_MEDIA_ENDPOINT http://minio:9000
            upsert_media_env CLASS_ACTIVITY_MEDIA_ACCESS_KEY "$_MEDIA_ACCESS"
            upsert_media_env CLASS_ACTIVITY_MEDIA_SECRET_KEY "$_MEDIA_SECRET"
            upsert_media_env CLASS_ACTIVITY_MEDIA_BUCKET "$_MEDIA_BUCKET"
            upsert_media_env CLASS_ACTIVITY_MEDIA_REGION us-east-1

            docker exec \
              -e DIIS_MEDIA_ACCESS="$_MEDIA_ACCESS" \
              -e DIIS_MEDIA_SECRET="$_MEDIA_SECRET" \
              -e DIIS_MEDIA_BUCKET="$_MEDIA_BUCKET" \
              -e DIIS_MEDIA_POLICY="$_MEDIA_POLICY" \
              -e DIIS_MEDIA_RESET="$_MEDIA_RESET" \
              smk-pg-backup sh -ceu '
                MC=/opt/backup-bin/mc
                test -x "$MC"
                "$MC" alias set diis-media "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" --quiet
                "$MC" mb --ignore-existing "diis-media/$DIIS_MEDIA_BUCKET" >/dev/null
                printf "%s\n" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$DIIS_MEDIA_BUCKET\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::$DIIS_MEDIA_BUCKET/*\"]}]}" > /tmp/diis-media-policy.json
                "$MC" admin policy create diis-media "$DIIS_MEDIA_POLICY" /tmp/diis-media-policy.json >/dev/null
                if [ "$DIIS_MEDIA_RESET" = "1" ] && "$MC" admin user info diis-media "$DIIS_MEDIA_ACCESS" >/dev/null 2>&1; then
                  "$MC" admin user remove diis-media "$DIIS_MEDIA_ACCESS" >/dev/null
                fi
                if ! "$MC" admin user info diis-media "$DIIS_MEDIA_ACCESS" >/dev/null 2>&1; then
                  "$MC" admin user add diis-media "$DIIS_MEDIA_ACCESS" "$DIIS_MEDIA_SECRET" >/dev/null
                fi
                "$MC" admin policy attach diis-media "$DIIS_MEDIA_POLICY" --user "$DIIS_MEDIA_ACCESS" >/dev/null
                "$MC" anonymous set none "diis-media/$DIIS_MEDIA_BUCKET" >/dev/null
                rm -f /tmp/diis-media-policy.json
              '
            unset _MEDIA_SECRET
            echo "Private class-activity media storage ready (${BRANCH} isolated)"

            # ── Build image (api, web, api-migrate) ──────────────────────────
            # api-migrate harus ikut di-build agar migration files selalu up-to-date.
            # BUILD_ARG_API_URL: Next.js rewrites() resolve process.env.API_URL at build
            # time (frozen into routes-manifest.json in standalone mode). Staging MUST
            # point to smk-staging-api:3001 (not prod api:3001) so SSR proxy works.
            if [ "$BRANCH" = "staging" ]; then
              BUILD_ARG_API="--build-arg API_URL=http://smk-staging-api:3001"
            else
              BUILD_ARG_API=""
            fi

            # shellcheck disable=SC2086
            docker compose $COMPOSE_ARGS --env-file "$ENV_FILE" \
              build --no-cache $BUILD_ARG_API api web api-migrate

            # ── Step 1: Jalankan Prisma migration (one-shot, DDL terpisah dari runtime) ──
            # api-migrate: service dengan profile migrate — jalankan prisma migrate deploy lalu exit.
            # Memisahkan hak DDL (CREATE/ALTER) dari runtime API container.
            # --no-deps wajib di staging: api-migrate.depends_on=postgres dari base compose
            # akan membuat container smk-postgres baru → conflict dengan prod container.
            # Postgres sudah running (prod stack) dan reachable via smk-network.
            echo "🔄 Running Prisma migration (${BRANCH})..."
            docker compose $COMPOSE_ARGS --env-file "$ENV_FILE" --profile migrate \
              run --rm --no-deps api-migrate
            echo "✅ Migration selesai"

            # ── Step 2: Deploy api & web dengan image baru ─────────────────────
            # --no-deps: jangan start postgres/redis/keycloak (sudah running dari prod stack)
            docker compose $COMPOSE_ARGS --env-file "$ENV_FILE" \
              up -d --no-deps api web

            # ── Tunggu api healthy ────────────────────────────────────────────
            echo "⏳ Menunggu ${API_CONTAINER} healthy (NestJS startup)..."
            timeout 150 sh -c \
              "until [ \"\$(docker inspect ${API_CONTAINER} --format '{{.State.Health.Status}}' 2>/dev/null)\" = \"healthy\" ]; do
                 STATUS=\$(docker inspect ${API_CONTAINER} --format '{{.State.Status}}' 2>/dev/null)
                 echo \"  status: \$STATUS, health: \$(docker inspect ${API_CONTAINER} --format '{{.State.Health.Status}}' 2>/dev/null)\"
                 sleep 10
              done" \
              || (
                echo "❌ ${API_CONTAINER} tidak healthy setelah 150s. Log terakhir:"
                docker logs "${API_CONTAINER}" --tail 50 2>&1
                exit 1
              )
            echo "✅ ${API_CONTAINER} healthy!"

            # Staging may verify shared ingress but cannot mutate it. Production
            # rollout is bounded, validates the candidate, and rolls back on any
            # recreate, network, nginx, or cross-environment health failure.
            if [ "$BRANCH" = "main" ]; then
              INGRESS_ROLLOUT_HANDOFF=1
              bash "$INGRESS_SCRIPT" rollout-production "$NGINX_CONFIG_SHA" "$NGINX_ROLLBACK_CONFIG"
              INGRESS_ROLLOUT_HANDOFF=0
            else
              bash "$INGRESS_SCRIPT" post-staging \
                "$AUTHORITATIVE_MAIN_SHA" "$AUTHORITATIVE_MAIN_TREE" \
                "$AUTHORITY_CONFIG_SHA" "$NGINX_AUTHORITY_CONFIG"
            fi

            echo "✅ Deploy berhasil! Branch: ${BRANCH} → ${API_CONTAINER} / ${WEB_CONTAINER}"

      - name: Notify deployment success
        if: success()
        env:
          DIIS_DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deploy berhasil untuk branch ${DIIS_DEPLOY_BRANCH}"
          # TODO: Tambahkan notifikasi WA via n8n webhook

      - name: Notify deployment failure
        if: failure()
        env:
          DIIS_DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deploy GAGAL untuk branch ${DIIS_DEPLOY_BRANCH}"
          # TODO: Tambahkan alert ke WA admin via n8n webhook
